[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-health"
version = "0.1.0"
description = "Measure the health of an AI coding-agent context. Exposes a 0-100 Context Health score."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12,<1",
    "pydantic>=2,<3",
    "anthropic>=0.30,<1",
]

[project.scripts]
context-health = "context_health.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
